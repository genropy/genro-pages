name: Checks
"on":
  push:
    branches: [main, develop, 'feat/**', 'fix/**', 'wf/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install ".[dev]"
      - run: ruff check src/ tests/ docs/conf.py
      - name: Tests (seed may have no tests)
        shell: bash
        run: |
          set +e
          python -m pytest tests/ --cov=genro_pages --cov-report=xml
          status=$?
          set -e
          if [ "$status" -eq 5 ]; then
            echo '::notice::Pre-Alpha seed: no tests collected.'
          else
            exit "$status"
          fi
      - run: python -m build
