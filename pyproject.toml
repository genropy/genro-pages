[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "genro-pages"
version = "0.1.0"
description = "Reactive pages built with Python and Genro"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Genropy Team", email = "info@softwell.it"}]
keywords = ["genro", "reactive", "web", "pages", "asgi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Framework :: AsyncIO",
]
dependencies = ["genro-asgi>=0.42.0", "genro-builders>=0.23.0"]

[project.optional-dependencies]
test = ["pytest>=7.0", "pytest-cov>=4.0", "pytest-asyncio>=0.23"]
dev = ["genro-pages[test]", "ruff>=0.1.0", "mypy>=1.0", "build>=1.0"]
docs = ["sphinx>=7.0", "sphinx-rtd-theme>=2.0", "myst-parser>=2.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/genro_pages"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
exclude = ["tests/"]
